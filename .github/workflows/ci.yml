# Проверка каждого изменения.
#
# Четыре шага идут одной работой, а не четырьмя параллельными: они делят
# установленные зависимости, а установка занимает больше, чем все проверки
# вместе. Разнести их значило бы платить за `npm ci` четыре раза ради
# выигрыша в несколько секунд.
#
# Порядок не случайный — от самого дешёвого к самому дорогому. Опечатка в
# импорте видна линтеру за секунды, и узнать о ней до сборки приятнее, чем
# после. Шаги не помечены `continue-on-error`: красный линт — повод
# починить линт, а не смотреть остальные три отчёта.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: проверять код,
# который уже переписали, незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest

    env:
      # Значения-заглушки, а не секреты, и это осознанно.
      #
      # Модуль src/lib/env.ts падает на старте, если публичных переменных
      # нет, — иначе ошибка всплыла бы первым запросом к базе. Сборке они
      # нужны, но именно как значения: все страницы рендерятся по запросу
      # (в отчёте сборки они помечены ƒ), к Supabase на этом этапе никто
      # не обращается. Проверено: сборка проходит с этими строками и без
      # доступа к сети.
      #
      # Поэтому настоящие ключи в CI не нужны. Класть их сюда значило бы
      # завести секрет, без которого публичный форк не соберётся, и
      # раздать доступ к базе каждому, кто правит workflow.
      NEXT_PUBLIC_SUPABASE_URL: https://example-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          # Версия та же, что в разработке. «Последняя» ломала бы сборку в
          # день выхода новой мажорной, причём без единой правки в коде.
          node-version: '24'
          cache: npm

      # ci, а не install: ставит ровно то, что записано в package-lock.json.
      # `npm install` вправе подтянуть более свежую совместимую версию, и
      # тогда CI проверяет не тот набор зависимостей, с которым работали.
      - name: Установить зависимости
        run: npm ci

      - name: Линт
        run: npm run lint

      # Включает next typegen: типы маршрутов генерируются из файловой
      # структуры, и без этого шага ссылка на несуществующую страницу
      # прошла бы проверку.
      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
